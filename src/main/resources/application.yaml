server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Kronyka
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kronyka}
    username: ${SPRING_DATASOURCE_USERNAME:kronyka}
    password: ${SPRING_DATASOURCE_PASSWORD:kronyka_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  exposed:
    generate-ddl: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET:kronyka-default-super-secret-hmac-sha256-key-32-chars-minimum!}
  expiration: ${JWT_EXPIRATION:86400}

kronyka:
  auction:
    settlement:
      enabled: ${KRONYKA_AUCTION_SETTLEMENT_ENABLED:true}
      fixed-delay-ms: ${KRONYKA_AUCTION_SETTLEMENT_FIXED_DELAY_MS:5000}
      batch-size: ${KRONYKA_AUCTION_SETTLEMENT_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: "Kronyka Auction API Reference"
  theme: deepSpace
  authentication:
    preferred-security-scheme: BearerAuth
