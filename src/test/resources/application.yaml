spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  exposed:
    generate-ddl: true
    show-sql: true

kronyka:
  auction:
    settlement:
      enabled: false
      fixed-delay-ms: 1000
      batch-size: 10

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  page-title: "Kronyka Auction API Reference"
  theme: deepSpace
  authentication:
    preferred-security-scheme: BearerAuth


