services:
  postgres:
    image: postgres:18-alpine
    container_name: kronyka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kronyka}
      POSTGRES_USER: ${POSTGRES_USER:-kronyka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kronyka_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kronyka} -d ${POSTGRES_DB:-kronyka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: kronyka-app
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kronyka}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kronyka}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kronyka_secret}
      JWT_SECRET: ${JWT_SECRET:-kronyka-default-super-secret-hmac-sha256-key-32-chars-minimum!}
      JWT_EXPIRATION: "${JWT_EXPIRATION:-86400}"
      KRONYKA_AUCTION_SETTLEMENT_ENABLED: "${KRONYKA_AUCTION_SETTLEMENT_ENABLED:-true}"
      KRONYKA_AUCTION_SETTLEMENT_FIXED_DELAY_MS: "${KRONYKA_AUCTION_SETTLEMENT_FIXED_DELAY_MS:-5000}"
      KRONYKA_AUCTION_SETTLEMENT_BATCH_SIZE: "${KRONYKA_AUCTION_SETTLEMENT_BATCH_SIZE:-50}"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
